# Configuração do Logstash para processar logs da aplicação

input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"

    codec => multiline {
      pattern => '^\s*(?:\{|[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}:[0-9]{2})'
      negate => true
      what => "previous"
    }
  }
}

filter {
  if [message] =~ /^\s*\{/ {

    # Interpreta os registros JSON da aplicação
    json {
      source => "message"
      target => "dados"
    }

    # Converte o timestamp do JSON para o formato
    # de data utilizado pelo Elasticsearch
    date {
      match => ["[dados][timestamp]", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
      timezone => "America/Sao_Paulo"
    }

  } else {

    # Extrai campos de logs em texto convencional
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:mensagem}"
      }
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      timezone => "America/Sao_Paulo"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "tarefas-logs"
  }

  stdout {
    codec => rubydebug
  }
}

